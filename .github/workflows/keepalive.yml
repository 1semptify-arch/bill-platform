name: keepalive

# Render free tier: 750 shared instance-hours/month across the whole
# workspace + 15-min idle spin-down. We can only keep ONE service warm
# (24h x 30d = ~720h ~ 750 cap), so Semptify gets the pool:
#
#   semptify-jsam      : warm 24/7 except a 2h buffer window
#                        (10:00-12:00 UTC = 4-6am CT, dead time)
#   bill-platform-5873 : NOT pinged — sleeps on Render, but every public
#                        page stays up 24/7 because the Cloudflare mirror
#                        worker serves it from the GitHub snapshot. Only
#                        live writes/API hits pay a ~30-60s wake.
#   septify-pi         : dead since Sept 5, ignored.
#
# The 2h buffer leaves ~60-90 hrs/month of headroom in the 750 pool for
# occasional bill-platform wake events without tripping the suspension.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Semptify origin
        run: |
          hour=$(date -u +%-H)
          # Buffer window: 10:00-11:59 UTC = 4-6am CT — let it sleep ~2h
          if [ "$hour" -ge 10 ] && [ "$hour" -lt 12 ]; then
            echo "buffer window — skipping (hour=$hour)"
            exit 0
          fi
          echo "ping semptify (hour=$hour)"
          curl -s -o /dev/null -w "semptify: %{http_code} in %{time_total}s\n" \
            "https://semptify-jsam.onrender.com/" || true
