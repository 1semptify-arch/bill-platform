# Render blueprint — Bill Platform, all free tier.
# Web service (free) + Litestream → Cloudflare R2 for SQLite persistence.
# Free tier has no persistent disk, so the DB lives on the ephemeral
# filesystem and Litestream keeps R2 in sync + restores on boot.
# Create: Render Dashboard → New → Blueprint → point at this repo.
#
# Dashboard env vars to set (sync:false = secrets, never in the file):
#   BILL_STEWARD_CODE           — steward passcode (REQUIRED in prod)
#   R2_BUCKET                   — e.g. bill-platform-db
#   R2_ENDPOINT                 — https://<account-id>.r2.cloudflarestorage.com
#   LITESTREAM_ACCESS_KEY_ID    — R2 API token
#   LITESTREAM_SECRET_ACCESS_KEY
services:
  - type: web
    name: bill-platform
    runtime: python
    plan: free
    buildCommand: curl -sL https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz | tar xz
    # Litestream only runs when R2 creds are set — without them the app
    # still boots and serves (ephemeral DB). This keeps the deploy green
    # while R2 API tokens (dashboard-only to create) are pending.
    startCommand: mkdir -p data && if [ -n "$LITESTREAM_ACCESS_KEY_ID" ]; then ./litestream-v0.3.13-linux-amd64/litestream restore -if-replica-exists -config litestream.yml ./data/platform.db; exec ./litestream-v0.3.13-linux-amd64/litestream replicate -config litestream.yml -exec "python server.py --host 0.0.0.0"; else exec python server.py --host 0.0.0.0; fi
    envVars:
      - key: BILL_STEWARD_CODE
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
