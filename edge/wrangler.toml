name = "bill-platform-proxy"
main = "proxy.js"
compatibility_date = "2025-01-01"
# Zone routes managed via API/dashboard — production bindings:
#   platform.semptify.org          (custom domain, auto-DNS)
#   semptify.org/bill*             (+www)
#   semptify.org/your-voice*       (+www)
#   semptify.org/what-the-bill-changes*   (+www)
# bill-mirror keeps: /, /static/*, /gen-image* (main Semptify site).
# No cron: Render free tier sleeps when idle — reads are served from
# the GitHub snapshot, only live-path hits wake the origin.
routes = [
  { pattern = "platform.semptify.org", zone_name = "semptify.org", custom_domain = true }
]
